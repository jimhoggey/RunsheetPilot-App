<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lighting — coming up</title>
<!-- The floating lighting heads-up (service_mate/lighting.py). Says what is
     COMING UP, never "change now": the moment is the room's call. Small
     and self-contained, so it sits on top of ProPresenter or the desk. -->
<style>
  :root { --bg: #111118; --text: #ececf3; --muted: #a4a4b8; --amber: #f59e0b; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--text);
         font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; justify-content: center; gap: 6px;
         padding: 12px 16px; border-top: 3px solid var(--amber); }
  .label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .label b { color: var(--amber); font-weight: 700; }
  #next { font-size: clamp(1.2rem, 7vw, 2rem); font-weight: 700; }
  #now { color: var(--muted); }
  .quiet #next { font-size: 1rem; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
  <div id="card" aria-live="polite">
    <div class="label" id="next-label"><b>Next change</b></div>
    <div id="next">—</div>
    <div id="now"></div>
  </div>
<script>
  const el = id => document.getElementById(id);
  async function refresh() {
    try {
      const h = await fetch('/api/lighting', {cache: 'no-store'}).then(r => r.json());
      const quiet = !h.has_lighting || !h.next;
      document.body.classList.toggle('quiet', quiet);
      el('next-label').innerHTML = h.next
        ? '<b>Next change</b> · at ' + escape(h.next_section) : '<b>Lighting</b>';
      el('next').textContent = !h.has_lighting ? 'This runsheet doesn’t mention lighting.'
        : h.next || 'No more lighting changes.';
      el('now').textContent = h.now ? 'Now: ' + h.now : '';
    } catch (_) { /* the app is restarting or closed: keep the last card */ }
  }
  function escape(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  }
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
